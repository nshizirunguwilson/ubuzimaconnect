packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/engines": true
  prisma: true
  esbuild: true
  "@swc/core": true
  argon2: true
  sharp: false
  "@google/genai": false
  protobufjs: false
  unrs-resolver: false

# FullCalendar's packages must all be the same version (DECISIONS.md D77): its plugins ask for "~6.1.21",
# which would otherwise pull their own sub-packages at a newer patch.
overrides:
  "@fullcalendar/core": 6.1.21
  "@fullcalendar/daygrid": 6.1.21
  "@fullcalendar/premium-common": 6.1.21
  "@fullcalendar/scrollgrid": 6.1.21
  "@fullcalendar/timeline": 6.1.21
